<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מחשבון גימטריה | FizzleKit</title>
  <meta name="description" content="מחשבון גימטריה חינמי: ערך רגיל, מספר גדול, מספר קטן ומספר סידורי, עם פירוט אותיות. הכול רץ בדפדפן, בלי שמירת נתונים.">
  <style>
    body{margin:0;background:#fffaf0;color:#222;font:18px/1.6 system-ui,-apple-system,sans-serif}
    main{max-width:640px;margin:0 auto;padding:24px 16px}
    h1{font-size:28px;margin:0 0 4px} p.sub{color:#666;margin-top:0}
    input{width:100%;box-sizing:border-box;font-size:24px;padding:12px;border:2px solid #f4a;border-radius:10px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
    .box{background:#fff;border:1px solid #eee;border-radius:10px;padding:10px;text-align:center}
    .box b{display:block;font-size:30px;color:#c0397a} .box span{font-size:14px;color:#666}
    #letters span{display:inline-block;margin:2px;padding:4px 8px;background:#fff;border:1px solid #eee;border-radius:6px}
    footer{margin-top:28px;font-size:13px;color:#888}
  </style>
</head>
<body>
<main>
  <h1>מחשבון גימטריה</h1>
  <p class="sub">כתבו מילה או משפט בעברית וקבלו את הערך מיד.</p>
  <input id="q" placeholder="למשל: שלום" autofocus autocomplete="off">
  <div class="grid">
    <div class="box"><b id="std">0</b><span>ערך רגיל (מספר הכרחי)</span></div>
    <div class="box"><b id="gad">0</b><span>מספר גדול (סופיות 500–900)</span></div>
    <div class="box"><b id="kat">0</b><span>מספר קטן</span></div>
    <div class="box"><b id="sid">0</b><span>מספר סידורי</span></div>
  </div>
  <div id="letters"></div>
  <p><a href="table.html">טבלת גימטריה</a></p>
  <footer>החישוב מתבצע בדפדפן שלכם. שום דבר לא נשלח ולא נשמר. FizzleKit.</footer>
</main>
<script src="gematria.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  $('q').addEventListener('input', (e) => {
    const r = gematria(e.target.value);
    $('std').textContent = r.standard; $('gad').textContent = r.gadol;
    $('kat').textContent = r.katan;   $('sid').textContent = r.siduri;
    $('letters').innerHTML = '';
    for (const l of r.letters) { const s = document.createElement('span'); s.textContent = l.ch + ' = ' + l.value; $('letters').appendChild(s); }
  });
</script>
</body>
</html>
